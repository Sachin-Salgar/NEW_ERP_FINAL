version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: new-erp-postgres
    restart: unless-stopped
    environment:
      # Infrastructure-only container. The application does not read these values.
      # Use .env.local as the single source of truth for application database credentials.
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: