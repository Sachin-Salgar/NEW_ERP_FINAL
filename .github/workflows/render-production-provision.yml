name: Render Production Database Provisioning Gate

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  checks: read

jobs:
  production-provision:
    name: production-provision
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Wait for all other commit checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          deadline=$((SECONDS + 30 * 60))
          self_name="production-provision"

          while (( SECONDS < deadline )); do
            mapfile -t rows < <(
              gh api --paginate                 -H "Accept: application/vnd.github+json"                 "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100"                 --jq '.check_runs[] | select(.name != "'$self_name'") | [.name,.status,.conclusion] | @tsv'
            )

            if (( ${#rows[@]} == 0 )); then
              echo "No other commit checks are visible yet; waiting..."
              sleep 15
              continue
            fi

            pending=0
            failed=0
            completed=0

            printf '%s\n' "${rows[@]}"

            for row in "${rows[@]}"; do
              IFS=$'\t' read -r name status conclusion <<<"$row"
              if [[ "$status" != "completed" ]]; then
                pending=1
              else
                completed=$((completed + 1))
                case "$conclusion" in
                  success|neutral|skipped)
                    ;;
                  *)
                    echo "::error::Commit check failed: $name ($conclusion)"
                    failed=1
                    ;;
                esac
              fi
            done

            if (( failed )); then
              exit 1
            fi

            if (( pending == 0 && completed > 0 )); then
              echo "All other visible commit checks completed successfully."
              break
            fi

            echo "Waiting for remaining commit checks..."
            sleep 15
          done

          if (( SECONDS >= deadline )); then
            echo "::error::Timed out waiting for the other commit checks."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build production provisioning artifact
        run: npm run build

      - name: Validate production provisioning secrets
        env:
          DB_PROVISIONING_DATABASE_URL: ${{ secrets.PROD_DB_PROVISIONING_DATABASE_URL }}
          DB_MIGRATION_DATABASE_URL: ${{ secrets.PROD_DB_MIGRATION_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PLATFORM_ADMIN_USERNAME: ${{ secrets.PROD_PLATFORM_ADMIN_USERNAME }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PROD_PLATFORM_ADMIN_PASSWORD }}
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PROD_PLATFORM_ADMIN_EMAIL }}
        run: |
          set -euo pipefail
          for name in             DB_PROVISIONING_DATABASE_URL             DB_MIGRATION_DATABASE_URL             DATABASE_URL             PLATFORM_ADMIN_USERNAME             PLATFORM_ADMIN_PASSWORD             PLATFORM_ADMIN_EMAIL
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret for $name"
              exit 1
            fi
          done

      - name: Provision Render PostgreSQL before deployment
        env:
          DB_PROVISIONING_DATABASE_URL: ${{ secrets.PROD_DB_PROVISIONING_DATABASE_URL }}
          DB_MIGRATION_DATABASE_URL: ${{ secrets.PROD_DB_MIGRATION_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DATABASE_SSL_MODE: require
          PLATFORM_ADMIN_USERNAME: ${{ secrets.PROD_PLATFORM_ADMIN_USERNAME }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PROD_PLATFORM_ADMIN_PASSWORD }}
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PROD_PLATFORM_ADMIN_EMAIL }}
        run: npm run db:provision:compiled
