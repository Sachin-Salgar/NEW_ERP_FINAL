name: CI - Integration Tests (Postgres)

on:
  push:
    branches:
      - main
      - 'ai/**'
  pull_request:
    branches:
      - main
      - 'ai/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      CI_TEST_DB: newerp_test
      CI_TEST_ROLE: newerp_test_runner
      CI_POSTGRES_PORT: '5433'
      CI_TEST_ROLE_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile
      - name: Start Postgres container (docker)
        env:
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Starting Postgres 17.10 container on host port ${CI_POSTGRES_PORT}..."
          : > postgres-startup-diagnostics.txt
          echo "=== docker run ===" | tee -a postgres-startup-diagnostics.txt
          docker rm -f newerp_test_container >/dev/null 2>&1 || true
          docker run --name newerp_test_container --env POSTGRES_PASSWORD --env POSTGRES_DB=postgres --env POSTGRES_USER=postgres -d -p "${CI_POSTGRES_PORT}:5432" postgres:17.10
          echo "=== container existence check ===" | tee -a postgres-startup-diagnostics.txt
          docker ps -a --filter "name=newerp_test_container" | tee -a postgres-startup-diagnostics.txt
          echo "=== container inspect ===" | tee -a postgres-startup-diagnostics.txt
          docker inspect newerp_test_container --format 'status={{.State.Status}} running={{.State.Running}} exitcode={{.State.ExitCode}} error={{.State.Error}}' | tee -a postgres-startup-diagnostics.txt
          echo "=== container logs (startup) ===" | tee -a postgres-startup-diagnostics.txt
          docker logs newerp_test_container 2>&1 | tee -a postgres-startup-diagnostics.txt || true
      - name: Install Postgres client for readiness checks
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client
      - name: Wait for Postgres service (pg_isready loop)
        env:
          PGPASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Waiting for Postgres to become available on port ${CI_POSTGRES_PORT}..." | tee -a postgres-startup-diagnostics.txt
          retries=0
          until pg_isready -h localhost -p "${CI_POSTGRES_PORT}" -U postgres -d postgres >/dev/null 2>&1; do
            retries=$((retries+1))
            echo "--- readiness attempt ${retries} ---" | tee -a postgres-startup-diagnostics.txt
            docker ps -a --filter "name=newerp_test_container" 2>&1 | tee -a postgres-startup-diagnostics.txt || true
            docker inspect newerp_test_container --format 'status={{.State.Status}} running={{.State.Running}} exitcode={{.State.ExitCode}} error={{.State.Error}}' 2>&1 | tee -a postgres-startup-diagnostics.txt || true
            if docker inspect newerp_test_container --format '{{.State.Running}}' 2>/dev/null | grep -q '^false$'; then
              echo "Postgres container has exited or is not running; printing recent logs" | tee -a postgres-startup-diagnostics.txt >&2
              docker logs --tail 200 newerp_test_container 2>&1 | tee -a postgres-startup-diagnostics.txt >&2 || true
              exit 1
            fi
            if [ "$retries" -ge 60 ]; then
              echo "Postgres did not become available in time" | tee -a postgres-startup-diagnostics.txt >&2
              docker logs --tail 200 newerp_test_container 2>&1 | tee -a postgres-startup-diagnostics.txt >&2 || true
              exit 1
            fi
            sleep 2
          done
          echo "Postgres is ready" | tee -a postgres-startup-diagnostics.txt
      - name: Upload Postgres diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-startup-diagnostics
          path: postgres-startup-diagnostics.txt
          if-no-files-found: warn
      - name: Create test role and database (non-superuser)
        env:
          PGPASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          psql -h localhost -p "${CI_POSTGRES_PORT}" -U postgres -d postgres -v ON_ERROR_STOP=1 -v db_name="${CI_TEST_DB}" -v role_name="${CI_TEST_ROLE}" -v role_password="${CI_TEST_ROLE_PASSWORD}" <<'SQL'
          SELECT format('CREATE DATABASE %I', :'db_name') \gexec
          SELECT format('CREATE ROLE %I WITH LOGIN PASSWORD %L NOSUPERUSER NOBYPASSRLS', :'role_name', :'role_password') \gexec
          ALTER ROLE :"role_name" WITH NOSUPERUSER NOBYPASSRLS;
          GRANT ALL PRIVILEGES ON DATABASE :"db_name" TO :"role_name";
          SQL
          psql -h localhost -p "${CI_POSTGRES_PORT}" -U postgres -d "${CI_TEST_DB}" -v ON_ERROR_STOP=1 -v role_name="${CI_TEST_ROLE}" <<'SQL'
          GRANT USAGE, CREATE ON SCHEMA public TO :"role_name";
          ALTER SCHEMA public OWNER TO :"role_name";
          GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO :"role_name";
          GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO :"role_name";
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO :"role_name";
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO :"role_name";
          SQL
      - name: Export TEST_DATABASE_URL
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import urllib.parse
          role = os.environ['CI_TEST_ROLE']
          password = os.environ['CI_TEST_ROLE_PASSWORD']
          db = os.environ['CI_TEST_DB']
          port = os.environ['CI_POSTGRES_PORT']
          encoded_password = urllib.parse.quote(password, safe='')
          postgres_url = f'postgres://{role}:{encoded_password}@localhost:{port}/{db}'
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write(f'TEST_DATABASE_URL={postgres_url}\n')
          PY
      - name: Run migrations
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          echo "Running migrations against TEST_DATABASE_URL (hidden)..."
          npm run db:migrate
      - name: "Debug: list public tables (post-migrations)"
        env:
          PGPASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          PGHOST: localhost
          PGPORT: ${{ env.CI_POSTGRES_PORT }}
          PGUSER: ${{ env.CI_TEST_ROLE }}
          PGDATABASE: ${{ env.CI_TEST_DB }}
        run: |
          set -euo pipefail
          psql -h localhost -p "${CI_POSTGRES_PORT}" -U "${CI_TEST_ROLE}" -d "${CI_TEST_DB}" -c "\dt public.*" > db-tables.txt || true
      - name: Upload DB table list (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-tables
          path: db-tables.txt
          if-no-files-found: warn
      - name: Seed deterministic E2E fixtures
        env:
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          set -euo pipefail
          node --trace-warnings --trace-uncaught scripts/ci/seed-e2e.js > seed-output.log 2>&1 || (cat seed-output.log >&2; exit 1)
      - name: Upload seed logs (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed-output
          path: seed-output.log
          if-no-files-found: warn
      - name: Start backend API for E2E validation
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          NODE_ENV: test
          HOST: 0.0.0.0
          PORT: 3000
          API_PREFIX: /api/v1
          JWT_SECRET: e2e-test-jwt-secret-should-be-long-enough
          TENANT_HEADER: x-tenant-id
          TENANT_HOST_MAP: '{"localhost":"11111111-1111-4111-8111-111111111111"}'
          CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:7358,http://127.0.0.1:7358
        run: |
          set -euo pipefail
          nohup env DATABASE_URL="$DATABASE_URL" TEST_DATABASE_URL="$TEST_DATABASE_URL" NODE_ENV="$NODE_ENV" HOST="$HOST" PORT="$PORT" API_PREFIX="$API_PREFIX" JWT_SECRET="$JWT_SECRET" TENANT_HEADER="$TENANT_HEADER" TENANT_HOST_MAP="$TENANT_HOST_MAP" CORS_ALLOWED_ORIGINS="$CORS_ALLOWED_ORIGINS" npm run dev > backend-e2e.log 2>&1 &
          echo $! > backend-e2e.pid
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/v1/bootstrap > /tmp/backend-bootstrap.json; then
              cat /tmp/backend-bootstrap.json
              exit 0
            fi
            sleep 2
          done
          tail -n 200 backend-e2e.log >&2 || true
          exit 1
      - name: Set up Flutter web SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
      - name: Enable Flutter web support
        run: flutter config --enable-web
      - name: Install Flutter dependencies
        working-directory: frontend
        run: flutter pub get
      - name: Install & Start standalone ChromeDriver (non-snap) — diagnostic
        run: |
          set -euo pipefail

          # Use the system Google Chrome binary (per test A/B setup)
          GOOGLE_CHROME_BIN=/usr/bin/google-chrome
          echo "Google Chrome binary path: $(which $GOOGLE_CHROME_BIN 2>/dev/null || true)"
          echo "Google Chrome version:"
          $GOOGLE_CHROME_BIN --version || true

          GOOGLE_CHROME_BIN=/usr/bin/google-chrome
          echo "Google Chrome path: $(which "$GOOGLE_CHROME_BIN" 2>/dev/null || true)"
          echo "Google Chrome version:"
          "$GOOGLE_CHROME_BIN" --version || true

          CHROME_VERSION=$($GOOGLE_CHROME_BIN --version 2>/dev/null | awk '{print $3}' || true)
          echo "Detected Chrome version: ${CHROME_VERSION:-<unknown>}"

          echo "Installing official standalone ChromeDriver via Puppeteer Browsers"
          npx --yes @puppeteer/browsers install chromedriver@stable --path /tmp/chrome-for-testing

          CHROMEDRIVER_BIN=$(find /tmp/chrome-for-testing -type f -name chromedriver | head -n 1)
          if [ -z "$CHROMEDRIVER_BIN" ]; then
            echo "ERROR: standalone chromedriver not found under /tmp/chrome-for-testing"
            find /tmp/chrome-for-testing -maxdepth 5 -type f 2>/dev/null | head -n 200 || true
            exit 1
          fi

          echo "Standalone ChromeDriver path: $CHROMEDRIVER_BIN"
          "$CHROMEDRIVER_BIN" --version || { echo "ERROR: installed chromedriver is not executable"; exit 1; }

          CHROMEDRIVER_VERSION=$("$CHROMEDRIVER_BIN" --version 2>/dev/null | awk '{print $2}' || true)
          echo "ChromeDriver version: ${CHROMEDRIVER_VERSION:-<unknown>}"

          if [ -n "$CHROME_VERSION" ] && [ -n "$CHROMEDRIVER_VERSION" ]; then
            CHROME_MAJOR=$(echo "$CHROME_VERSION" | cut -d. -f1)
            CHROMEDRIVER_MAJOR=$(echo "$CHROMEDRIVER_VERSION" | cut -d. -f1)
            echo "Chrome major: ${CHROME_MAJOR}"
            echo "ChromeDriver major: ${CHROMEDRIVER_MAJOR}"
            if [ "$CHROME_MAJOR" != "$CHROMEDRIVER_MAJOR" ]; then
              echo "ERROR: Chrome/ChromeDriver major-version mismatch"
              echo "Chrome version: $CHROME_VERSION"
              echo "ChromeDriver version: $CHROMEDRIVER_VERSION"
              exit 1
            fi
          fi

          echo "Verified standalone ChromeDriver is executable and compatible"

          # Start only the downloaded standalone driver; do not use snap/system chromedriver
          rm -f /tmp/chromedriver.log || true
          nohup "$CHROMEDRIVER_BIN" \
            --port=4444 \
            --url-base=/wd/hub \
            >/tmp/chromedriver.log 2>&1 &
          echo $! > chromedriver.pid

          for i in $(seq 1 30); do
            if nc -z localhost 4444; then
              echo "standalone chromedriver ready"
              break
            fi
            sleep 1
          done

          echo "=== CHROMEDRIVER STARTUP LOG (tail) ==="
          tail -n 200 /tmp/chromedriver.log || true

          echo "=== CHROMEDRIVER PROCESS INFO ==="
          if [ -f chromedriver.pid ]; then
            ps -fp "$(cat chromedriver.pid)" || true
          else
            ps aux | grep chromedriver | grep -v grep || true
          fi

          echo "=== DIAGNOSTIC: running chrome/chromium/chromedriver processes ==="
          ps aux | grep -E 'chrome|chromium|chromedriver' | grep -v grep || true

      - name: ChromeDriver WebDriver-level diagnostic
        run: |
          set -euo pipefail
          echo "Checking chromedriver /status endpoint"
          curl -sS http://localhost:4444/wd/hub/status || true

          echo "Attempting a lightweight WebDriver new session (diagnostic only, will delete if created)"
          session_response=$(curl -s -X POST http://localhost:4444/wd/hub/session -H "Content-Type: application/json" -d '{"capabilities":{"alwaysMatch":{"browserName":"chrome","goog:chromeOptions":{"args":["--headless=new","--disable-gpu"]}}}}' || true)
          echo "Session response: $session_response"

          # Try to extract session id for both JSON shapes
          sess=$(echo "$session_response" | sed -n 's/.*"sessionId"\s*:\s*"\([^"]*\)".*/\1/p' || true)
          if [ -z "$sess" ]; then
            sess=$(echo "$session_response" | sed -n 's/.*"value"\s*:\s*{\s*"sessionId"\s*:\s*"\([^"]*\)".*/\1/p' || true)
          fi
          if [ -n "$sess" ]; then
            echo "Created WebDriver session: $sess"
            curl -s -X DELETE http://localhost:4444/wd/hub/session/$sess || true
            echo "Deleted session $sess"
          else
            echo "No WebDriver session created (session_response may contain error details)"
          fi

          echo "Current chromedriver processes after session check:"
          ps aux | grep chromedriver | grep -v grep || true

      - name: Run Flutter login and tenant auth E2E test (drive)
        timeout-minutes: 10
        env:
          API_BASE_URL: http://localhost:3000
          TENANT_ID: 11111111-1111-4111-8111-111111111111
          CHROME_EXECUTABLE: /usr/bin/google-chrome
          CHROME_BIN: /usr/bin/google-chrome
        working-directory: frontend
        run: |
          set -euo pipefail
          flutter drive --driver=test_driver/integration_test.dart --target=integration_test/login_tenant_auth_e2e_test.dart -d chrome \
            --dart-define=API_BASE_URL=http://localhost:3000 \
            --dart-define=TENANT_ID=11111111-1111-4111-8111-111111111111
      - name: Upload backend E2E log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-e2e-log
          path: backend-e2e.log
          if-no-files-found: warn
      - name: Post-E2E ChromeDriver & Chrome diagnostics
        if: always()
        run: |
          set -euo pipefail
          echo "=== ChromeDriver log ==="
          cat /tmp/chromedriver.log || true
          echo ""
          echo "=== ChromeDriver process ==="
          ps aux | grep chromedriver | grep -v grep || true
          echo ""
          echo "=== Chrome/Chromium processes ==="
          ps aux | grep -E 'chrome|chromium' | grep -v grep || true
          echo ""
          echo "=== Listening ports ==="
          ss -lntp || true
          echo ""
          echo "=== dmesg tail (kernel logs may show crashes) ==="
          sudo dmesg | tail -n 200 || true

      - name: Run integration tests (DB-backed)
        env:
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: npm run test:integration
      - name: Run unit tests
        run: npm run test:unit
      - name: Typecheck
        run: npm run typecheck
      - name: Git diff check
        run: git --no-pager diff --check
