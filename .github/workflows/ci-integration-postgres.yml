name: CI - Integration Tests (Postgres)

on:
  push:
    branches:
      - main
      - 'ai/**'
  pull_request:
    branches:
      - main
      - 'ai/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI_TEST_DB: newerp_test
      CI_TEST_ROLE: newerp_test_runner
      CI_POSTGRES_PORT: '5433'
      CI_TEST_ROLE_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile

      - name: Start Postgres 17
        env:
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          docker run --name newerp_test_container --env POSTGRES_PASSWORD --env POSTGRES_DB=postgres --env POSTGRES_USER=postgres -d -p "${CI_POSTGRES_PORT}:5432" postgres:17.10

      - name: Install Postgres client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        env:
          PGPASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if pg_isready -h localhost -p "${CI_POSTGRES_PORT}" -U postgres -d postgres >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs newerp_test_container
          exit 1

      - name: Create test database and non-superuser roles
        env:
          PGPASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          psql -h localhost -p "${CI_POSTGRES_PORT}" -U postgres -d postgres -v ON_ERROR_STOP=1 -v db_name="${CI_TEST_DB}" -v role_name="${CI_TEST_ROLE}" -v role_password="${CI_TEST_ROLE_PASSWORD}" <<'SQL'
          SELECT format('CREATE ROLE erp LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB CREATEROLE NOREPLICATION NOBYPASSRLS', :'role_password') \gexec
          SELECT format('CREATE DATABASE %I OWNER erp', :'db_name') \gexec
          SELECT format('CREATE ROLE %I WITH LOGIN PASSWORD %L NOSUPERUSER NOBYPASSRLS', :'role_name', :'role_password') \gexec
          SELECT 'CREATE ROLE erp_app NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION NOLOGIN' \gexec
          SQL
          psql -h localhost -p "${CI_POSTGRES_PORT}" -U postgres -d postgres -v ON_ERROR_STOP=1 -v db_name="${CI_TEST_DB}" -v role_name="${CI_TEST_ROLE}" <<'SQL'
          SELECT format('GRANT CREATE, CONNECT, TEMPORARY ON DATABASE %I TO %I', :'db_name', :'role_name') \gexec
          SQL
          psql -h localhost -p "${CI_POSTGRES_PORT}" -U postgres -d "${CI_TEST_DB}" -v ON_ERROR_STOP=1 -v role_name="${CI_TEST_ROLE}" <<'SQL'
          GRANT USAGE, CREATE ON SCHEMA public TO :"role_name";
          ALTER SCHEMA public OWNER TO erp;
          GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO :"role_name";
          GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO :"role_name";
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO :"role_name";
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO :"role_name";
          SQL

      - name: Export TEST_DATABASE_URL
        env:
          CI_POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        run: |
          python - <<'PY'
          import os, urllib.parse
          role = os.environ['CI_TEST_ROLE']
          password = urllib.parse.quote(os.environ['CI_TEST_ROLE_PASSWORD'], safe='')
          admin_password = urllib.parse.quote(os.environ['CI_POSTGRES_PASSWORD'], safe='')
          db = os.environ['CI_TEST_DB']
          port = os.environ['CI_POSTGRES_PORT']
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'TEST_DATABASE_URL=postgres://{role}:{password}@localhost:{port}/{db}\n')
              f.write(f'DATABASE_URL=postgres://erp:{password}@localhost:{port}/{db}\n')
              f.write(f'PLATFORM_DATABASE_URL=postgres://postgres:{admin_password}@localhost:{port}/{db}\n')
              f.write(f'PLATFORM_SECURITY_DATABASE_URL=postgres://postgres:{admin_password}@localhost:{port}/{db}\n')
              f.write(f'INTEGRATION_ADMIN_DATABASE_URL=postgres://postgres:{admin_password}@localhost:{port}/{db}\n')
          PY

      - name: Run migrations
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          PLATFORM_SECURITY_DATABASE_URL: ${{ env.PLATFORM_SECURITY_DATABASE_URL }}
          DATABASE_SSL_MODE: disable
        run: |
          npm run db:migrate
          npm run build
          npm run db:security-bootstrap

      - name: Grant E2E role access to migrated objects
        env:
          PGPASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          psql -h localhost -p "${CI_POSTGRES_PORT}" -U postgres -d "${CI_TEST_DB}" -v ON_ERROR_STOP=1 -v role_name="${CI_TEST_ROLE}" <<'SQL'
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO :"role_name";
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO :"role_name";
          SQL

      - name: Seed deterministic E2E fixtures
        env:
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: node --trace-warnings --trace-uncaught scripts/ci/seed-e2e.js

      - name: Start backend API
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          PLATFORM_DATABASE_URL: ${{ env.PLATFORM_DATABASE_URL }}
          DATABASE_SSL_MODE: disable
          NODE_ENV: test
          HOST: 0.0.0.0
          PORT: 3000