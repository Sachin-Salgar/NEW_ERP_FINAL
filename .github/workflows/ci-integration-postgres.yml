name: CI - Integration Tests (Postgres)

on:
  push:
    branches:
      - main
      - 'ai/**'
  pull_request:
    branches:
      - main
      - 'ai/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      CI_TEST_DB: newerp_test
      CI_TEST_ROLE: newerp_test_runner
      CI_POSTGRES_PORT: '5433'
      CI_TEST_ROLE_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile
      - name: Start Postgres container (docker)
        env:
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          docker rm -f newerp_test_container >/dev/null 2>&1 || true
          docker run --name newerp_test_container --env POSTGRES_PASSWORD --env POSTGRES_DB=postgres --env POSTGRES_USER=postgres -d -p "${CI_POSTGRES_PORT}:5432" postgres:17.10
      - name: Install Postgres client for readiness checks
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client
      - name: Wait for Postgres service
        env:
          PGPASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if pg_isready -h localhost -p "${CI_POSTGRES_PORT}" -U postgres -d postgres >/dev/null 2>&1; then
              echo "Postgres is ready"
              exit 0
            fi
            if ! docker inspect newerp_test_container --format '{{.State.Running}}' 2>/dev/null | grep -q '^true$'; then
              docker logs --tail 200 newerp_test_container || true
              exit 1
            fi
            sleep 2
          done
          docker logs --tail 200 newerp_test_container || true
          exit 1
      - name: Create test role and database (non-superuser)
        env:
          PGPASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          psql -h localhost -p "${CI_POSTGRES_PORT}" -U postgres -d postgres -v ON_ERROR_STOP=1 -v db_name="${CI_TEST_DB}" -v role_name="${CI_TEST_ROLE}" -v role_password="${CI_TEST_ROLE_PASSWORD}" <<'SQL'
          SELECT format('CREATE DATABASE %I', :'db_name') \gexec
          SELECT format('CREATE ROLE %I WITH LOGIN PASSWORD %L NOSUPERUSER NOBYPASSRLS', :'role_name', :'role_password') \gexec
          ALTER ROLE :"role_name" WITH NOSUPERUSER NOBYPASSRLS;
          GRANT ALL PRIVILEGES ON DATABASE :"db_name" TO :"role_name";
          SQL
          psql -h localhost -p "${CI_POSTGRES_PORT}" -U postgres -d "${CI_TEST_DB}" -v ON_ERROR_STOP=1 -v role_name="${CI_TEST_ROLE}" <<'SQL'
          GRANT USAGE, CREATE ON SCHEMA public TO :"role_name";
          ALTER SCHEMA public OWNER TO :"role_name";
          GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO :"role_name";
          GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO :"role_name";
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO :"role_name";
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO :"role_name";
          SQL
      - name: Export TEST_DATABASE_URL
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import urllib.parse
          role = os.environ['CI_TEST_ROLE']
          password = os.environ['CI_TEST_ROLE_PASSWORD']
          db = os.environ['CI_TEST_DB']
          port = os.environ['CI_POSTGRES_PORT']
          encoded_password = urllib.parse.quote(password, safe='')
          postgres_url = f'postgres://{role}:{encoded_password}@localhost:{port}/{db}'
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f'TEST_DATABASE_URL={postgres_url}\n')
          PY
      - name: Run migrations
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: npm run db:migrate
      - name: Seed deterministic E2E fixtures
        env:
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: node --trace-warnings --trace-uncaught scripts/ci/seed-e2e.js
      - name: Start backend API for E2E validation
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          NODE_ENV: test
          HOST: 0.0.0.0
          PORT: 3000
          API_PREFIX: /api/v1
          JWT_SECRET: e2e-test-jwt-secret-should-be-long-enough
          TENANT_HEADER: x-tenant-id
          TENANT_HOST_MAP: '{"localhost":"11111111-1111-4111-8111-111111111111"}'
          CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:7358,http://127.0.0.1:7358
        run: |
          set -euo pipefail
          nohup env DATABASE_URL="$DATABASE_URL" TEST_DATABASE_URL="$TEST_DATABASE_URL" NODE_ENV="$NODE_ENV" HOST="$HOST" PORT="$PORT" API_PREFIX="$API_PREFIX" JWT_SECRET="$JWT_SECRET" TENANT_HEADER="$TENANT_HEADER" TENANT_HOST_MAP="$TENANT_HOST_MAP" CORS_ALLOWED_ORIGINS="$CORS_ALLOWED_ORIGINS" npm run dev > backend-e2e.log 2>&1 &
          echo $! > backend-e2e.pid
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/v1/bootstrap > /tmp/backend-bootstrap.json; then
              cat /tmp/backend-bootstrap.json
              exit 0
            fi
            sleep 2
          done
          tail -n 200 backend-e2e.log >&2 || true
          exit 1
      - name: Set up Java for Selenium compatibility bridge
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter web SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
      - name: Enable Flutter web support
        run: flutter config --enable-web
      - name: Install Flutter dependencies
        working-directory: frontend
        run: flutter pub get
      - name: Install ChromeDriver matching installed Chrome
        run: |
          set -euo pipefail
          CHROME=/usr/bin/google-chrome
          CHROME_VERSION=$("$CHROME" --version | awk '{print $3}')
          echo "Chrome: $CHROME_VERSION"
          npx --yes @puppeteer/browsers install "chromedriver@$CHROME_VERSION" --path /tmp/chrome-for-testing
          CHROMEDRIVER_BIN=$(find /tmp/chrome-for-testing -type f -name chromedriver | head -n 1)
          test -n "$CHROMEDRIVER_BIN"
          "$CHROMEDRIVER_BIN" --version
          sudo install -m 0755 "$CHROMEDRIVER_BIN" /usr/local/bin/chromedriver
          chromedriver --version
      - name: Start Selenium 4.8.3 compatibility bridge
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/selenium-server-4.8.3.jar https://github.com/SeleniumHQ/selenium/releases/download/selenium-4.8.0/selenium-server-4.8.3.jar
          nohup java -jar /tmp/selenium-server-4.8.3.jar standalone \
            --port 4444 \
            --host 127.0.0.1 \
            >/tmp/selenium-server.log 2>&1 &
          echo $! > selenium-server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4444/status >/tmp/selenium-status.json; then
              cat /tmp/selenium-status.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/selenium-server.log || true
          exit 1
      - name: Verify Selenium legacy-session compatibility
        run: |
          set -euo pipefail
          response=$(curl -sS -X POST http://127.0.0.1:4444/wd/hub/session \
            -H 'Content-Type: application/json;charset=UTF-8' \
            -d '{"desiredCapabilities":{"browserName":"chrome","chromeOptions":{"args":["--headless=new","--no-sandbox","--disable-dev-shm-usage"]}},"capabilities":{"alwaysMatch":{"browserName":"chrome","goog:chromeOptions":{"args":["--headless=new","--no-sandbox","--disable-dev-shm-usage"]}}}}')
          echo "$response"
          echo "$response" | grep -q 'sessionId'
          session=$(echo "$response" | sed -n 's/.*"sessionId"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
          test -n "$session"
          curl -sS -X DELETE "http://127.0.0.1:4444/wd/hub/session/$session" || true
      - name: Run Flutter login and tenant auth E2E test (drive)
        timeout-minutes: 10
        env:
          API_BASE_URL: http://localhost:3000
          TENANT_ID: 11111111-1111-4111-8111-111111111111
          CHROME_EXECUTABLE: /usr/bin/google-chrome
          CHROME_BIN: /usr/bin/google-chrome
        working-directory: frontend
        run: |
          set -euo pipefail
          flutter drive \
            --verbose \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/login_tenant_auth_e2e_test.dart \
            -d web-server \
            --browser-name=chrome \
            --driver-port=4444 \
            --web-hostname=127.0.0.1 \
            --web-port=7358 \
            --headless \
            --web-run-headless \
            --web-browser-flag=--no-sandbox \
            --web-browser-flag=--disable-dev-shm-usage \
            --dart-define=API_BASE_URL=http://localhost:3000 \
            --dart-define=TENANT_ID=11111111-1111-4111-8111-111111111111
      - name: Upload backend E2E log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-e2e-log
          path: backend-e2e.log
          if-no-files-found: warn
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-diagnostics
          path: |
            /tmp/selenium-server.log
            /tmp/chromedriver.log
          if-no-files-found: warn
      - name: Run integration tests (DB-backed)
        env:
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: npm run test:integration
      - name: Run unit tests
        run: npm run test:unit
      - name: Typecheck
        run: npm run typecheck
      - name: Git diff check
        run: git --no-pager diff --check
