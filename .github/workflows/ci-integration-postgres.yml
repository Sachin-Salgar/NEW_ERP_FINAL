name: CI — Integration Tests (Postgres)

on:
  push:
    branches:
      - main
      - 'ai/**'
  pull_request:
    branches:
      - main
      - 'ai/**'

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      # Name of the ephemeral test database and test role that will be created by the job.
      CI_TEST_DB: newerp_test
      CI_TEST_ROLE: newerp_test_runner
      CI_POSTGRES_PORT: '5433'
      # Do NOT place passwords in repository. The role password is provided via the CI_POSTGRES_PASSWORD secret.
      CI_TEST_ROLE_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile

      - name: Start Postgres container (docker)
        env:
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Starting Postgres 17.10 container on host port ${CI_POSTGRES_PORT}..."
          : > postgres-startup-diagnostics.txt
          echo "=== docker run ===" | tee -a postgres-startup-diagnostics.txt
          docker rm -f newerp_test_container >/dev/null 2>&1 || true
          docker run --name newerp_test_container \
            --env POSTGRES_PASSWORD \
            --env POSTGRES_DB=postgres \
            --env POSTGRES_USER=postgres \
            -d \
            -p "${CI_POSTGRES_PORT}:5432" \
            postgres:17.10

          echo "=== container existence check ===" | tee -a postgres-startup-diagnostics.txt
          docker ps -a --filter "name=newerp_test_container" | tee -a postgres-startup-diagnostics.txt
          echo "=== container inspect ===" | tee -a postgres-startup-diagnostics.txt
          docker inspect newerp_test_container --format 'status={{.State.Status}} running={{.State.Running}} exitcode={{.State.ExitCode}} error={{.State.Error}}' | tee -a postgres-startup-diagnostics.txt
          echo "=== container logs (startup) ===" | tee -a postgres-startup-diagnostics.txt
          docker logs newerp_test_container 2>&1 | tee -a postgres-startup-diagnostics.txt || true

      - name: Install Postgres client for readiness checks
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres service (pg_isready loop)
        env:
          PGPASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Waiting for Postgres to become available on port ${CI_POSTGRES_PORT}..." | tee -a postgres-startup-diagnostics.txt
          retries=0
          until pg_isready -h localhost -p "${CI_POSTGRES_PORT}" -U postgres -d postgres >/dev/null 2>&1; do
            retries=$((retries+1))
            echo "--- readiness attempt ${retries} ---" | tee -a postgres-startup-diagnostics.txt
            echo "=== docker ps -a ===" | tee -a postgres-startup-diagnostics.txt
            docker ps -a --filter "name=newerp_test_container" 2>&1 | tee -a postgres-startup-diagnostics.txt || true
            echo "=== docker inspect ===" | tee -a postgres-startup-diagnostics.txt
            docker inspect newerp_test_container --format 'status={{.State.Status}} running={{.State.Running}} exitcode={{.State.ExitCode}} error={{.State.Error}}' 2>&1 | tee -a postgres-startup-diagnostics.txt || true

            if docker inspect newerp_test_container --format '{{.State.Running}}' 2>/dev/null | grep -q '^false$'; then
              echo "Postgres container has exited or is not running; printing recent logs" | tee -a postgres-startup-diagnostics.txt >&2
              docker inspect newerp_test_container --format 'status={{.State.Status}} running={{.State.Running}} exitcode={{.State.ExitCode}} error={{.State.Error}}' 2>&1 | tee -a postgres-startup-diagnostics.txt >&2 || true
              echo "=== PostgreSQL logs (tail 200) ===" | tee -a postgres-startup-diagnostics.txt >&2
              docker logs --tail 200 newerp_test_container 2>&1 | tee -a postgres-startup-diagnostics.txt >&2 || true
              exit 1
            fi

            if [ "$retries" -ge 60 ]; then
              echo "Postgres did not become available in time" | tee -a postgres-startup-diagnostics.txt >&2
              echo "=== final container state ===" | tee -a postgres-startup-diagnostics.txt >&2
              docker inspect newerp_test_container --format 'status={{.State.Status}} running={{.State.Running}} exitcode={{.State.ExitCode}} error={{.State.Error}}' 2>&1 | tee -a postgres-startup-diagnostics.txt >&2 || true
              echo "=== final logs ===" | tee -a postgres-startup-diagnostics.txt >&2
              docker logs --tail 200 newerp_test_container 2>&1 | tee -a postgres-startup-diagnostics.txt >&2 || true
              exit 1
            fi

            if [ "$((retries % 5))" -eq 0 ]; then
              echo "=== PostgreSQL logs (tail 100) ===" | tee -a postgres-startup-diagnostics.txt >&2
              docker logs --tail 100 newerp_test_container 2>&1 | tee -a postgres-startup-diagnostics.txt >&2 || true
            fi

            sleep 2
          done
          echo "Postgres is ready" | tee -a postgres-startup-diagnostics.txt

      - name: Upload Postgres diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-startup-diagnostics
          path: postgres-startup-diagnostics.txt
          if-no-files-found: warn

      - name: Create test role and database (non-superuser)
        env:
          PGPASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Creating test database and non-superuser test role..."
          psql -h localhost -p "${CI_POSTGRES_PORT}" -U postgres -d postgres -v ON_ERROR_STOP=1 <<'PSQL'
          -- Create the test database if it doesn't exist
          CREATE DATABASE "${CI_TEST_DB}";
          -- Create a non-superuser role for tests; NOBYPASSRLS ensures RLS is not bypassed
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '${CI_TEST_ROLE}') THEN
              CREATE ROLE "${CI_TEST_ROLE}" WITH LOGIN PASSWORD '${CI_TEST_ROLE_PASSWORD}' NOSUPERUSER NOBYPASSRLS;
            END IF;
            -- Ensure role attributes
            ALTER ROLE "${CI_TEST_ROLE}" WITH NOSUPERUSER NOBYPASSRLS;
          END
          $$;
          -- Grant privileges on the database to the test role
          GRANT ALL PRIVILEGES ON DATABASE "${CI_TEST_DB}" TO "${CI_TEST_ROLE}";
          PSQL

      - name: Export TEST_DATABASE_URL
        run: |
          set -euo pipefail
          # Encode the password so reserved characters remain valid inside the PostgreSQL URL.
          python - <<'PY'
          import os
          import urllib.parse

          role = os.environ['CI_TEST_ROLE']
          password = os.environ['CI_TEST_ROLE_PASSWORD']
          db = os.environ['CI_TEST_DB']
          port = os.environ['CI_POSTGRES_PORT']
          encoded_password = urllib.parse.quote(password, safe='')
          postgres_url = f'postgres://{role}:{encoded_password}@localhost:{port}/{db}'
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write(f'TEST_DATABASE_URL={postgres_url}\n')
          PY

      - name: Run migrations
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          echo "Running migrations against TEST_DATABASE_URL (hidden)..."
          npm run db:migrate

      - name: Run integration tests (DB-backed)
        env:
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          echo "Running integration tests against TEST_DATABASE_URL (hidden)..."
          npm run test:integration

      - name: Run unit tests
        run: npm run test:unit

      - name: Typecheck
        run: npm run typecheck

      - name: Git diff check
        run: git --no-pager diff --check
