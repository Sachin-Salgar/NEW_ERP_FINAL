name: CI - Integration Tests (Postgres)

on:
  push:
    branches:
      - main
      - 'ai/**'
  pull_request:
    branches:
      - main
      - 'ai/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI_TEST_DB: newerp_test
      CI_TEST_ROLE: newerp_test_runner
      CI_POSTGRES_PORT: '5433'
      CI_TEST_ROLE_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile

      - name: Start Postgres 17
        env:
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          docker run --name newerp_test_container --env POSTGRES_PASSWORD --env POSTGRES_DB=postgres --env POSTGRES_USER=postgres -d -p "${CI_POSTGRES_PORT}:5432" postgres:17.10

      - name: Install Postgres client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        env:
          PGPASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if pg_isready -h localhost -p "${CI_POSTGRES_PORT}" -U postgres -d postgres >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs newerp_test_container
          exit 1

      - name: Create test database and non-superuser role
        env:
          PGPASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          psql -h localhost -p "${CI_POSTGRES_PORT}" -U postgres -d postgres -v ON_ERROR_STOP=1 -v db_name="${CI_TEST_DB}" -v role_name="${CI_TEST_ROLE}" -v role_password="${CI_TEST_ROLE_PASSWORD}" <<'SQL'
          SELECT format('CREATE DATABASE %I', :'db_name') \gexec
          SELECT format('CREATE ROLE %I WITH LOGIN PASSWORD %L NOSUPERUSER NOBYPASSRLS', :'role_name', :'role_password') \gexec
          SQL
          psql -h localhost -p "${CI_POSTGRES_PORT}" -U postgres -d postgres -v ON_ERROR_STOP=1 -v db_name="${CI_TEST_DB}" -v role_name="${CI_TEST_ROLE}" <<'SQL'
          SELECT format('GRANT CREATE, CONNECT, TEMPORARY ON DATABASE %I TO %I', :'db_name', :'role_name') \gexec
          SQL
          psql -h localhost -p "${CI_POSTGRES_PORT}" -U postgres -d "${CI_TEST_DB}" -v ON_ERROR_STOP=1 -v role_name="${CI_TEST_ROLE}" <<'SQL'
          GRANT USAGE, CREATE ON SCHEMA public TO :"role_name";
          ALTER SCHEMA public OWNER TO :"role_name";
          GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO :"role_name";
          GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO :"role_name";
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO :"role_name";
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO :"role_name";
          SQL

      - name: Export TEST_DATABASE_URL
        run: |
          python - <<'PY'
          import os, urllib.parse
          role = os.environ['CI_TEST_ROLE']
          password = urllib.parse.quote(os.environ['CI_TEST_ROLE_PASSWORD'], safe='')
          db = os.environ['CI_TEST_DB']
          port = os.environ['CI_POSTGRES_PORT']
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'TEST_DATABASE_URL=postgres://{role}:{password}@localhost:{port}/{db}\n')
          PY

      - name: Run migrations
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: npm run db:migrate

      - name: Seed deterministic E2E fixtures
        env:
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: node --trace-warnings --trace-uncaught scripts/ci/seed-e2e.js

      - name: Start backend API
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          NODE_ENV: test
          HOST: 0.0.0.0
          PORT: 3000
          API_PREFIX: /api/v1
          JWT_SECRET: e2e-test-jwt-secret-should-be-long-enough
          CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080
        run: |
          set -euo pipefail
          nohup env DATABASE_URL="$DATABASE_URL" TEST_DATABASE_URL="$TEST_DATABASE_URL" NODE_ENV="$NODE_ENV" HOST="$HOST" PORT="$PORT" API_PREFIX="$API_PREFIX" JWT_SECRET="$JWT_SECRET" CORS_ALLOWED_ORIGINS="$CORS_ALLOWED_ORIGINS" npm run dev > backend-e2e.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/v1/bootstrap >/tmp/backend-bootstrap.json; then cat /tmp/backend-bootstrap.json; exit 0; fi
            sleep 2
          done
          cat backend-e2e.log
          exit 1

      - name: Set up Flutter web SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'

      - name: Enable Flutter web
        run: flutter config --enable-web

      - name: Install Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Set up ChromeDriver
        run: |
          set -euo pipefail
          CHROME_VERSION=$(google-chrome --version | awk '{print $3}')
          CHROME_MAJOR=${CHROME_VERSION%%.*}
          DRIVER_VERSION=$(curl -fsSL "https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_${CHROME_MAJOR}")
          wget -q "https://storage.googleapis.com/chrome-for-testing-public/${DRIVER_VERSION}/linux64/chromedriver-linux64.zip"
          unzip -q chromedriver-linux64.zip
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
          sudo chmod +x /usr/local/bin/chromedriver
          chromedriver --version

      - name: Start ChromeDriver
        run: |
          set -euo pipefail
          nohup chromedriver --port=4444 --host=127.0.0.1 > chromedriver.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4444/status >/tmp/chromedriver-status.json; then cat /tmp/chromedriver-status.json; exit 0; fi
            sleep 1
          done
          cat chromedriver.log
          exit 1

      - name: Run admin E2E test
        working-directory: frontend
        env:
          CHROME_EXECUTABLE: /usr/bin/google-chrome
        run: |
          set -o pipefail
          flutter drive --driver=test_driver/integration_test.dart --target=integration_test/admin_login_e2e_test.dart -d web-server --browser-name=chrome --driver-port=4444 --web-port=8080 --dart-define=API_BASE_URL=http://localhost:3000 2>&1 | tee admin-e2e-test.log

      - name: Run limited-user E2E test
        working-directory: frontend
        env:
          CHROME_EXECUTABLE: /usr/bin/google-chrome
        run: |
          set -o pipefail
          flutter drive --driver=test_driver/integration_test.dart --target=integration_test/limited_user_login_e2e_test.dart -d web-server --browser-name=chrome --driver-port=4444 --web-port=8081 --dart-define=API_BASE_URL=http://localhost:3000 2>&1 | tee limited-user-e2e-test.log

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-e2e-logs
          path: frontend/*-e2e-test.log

      - name: Upload backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-e2e-log
          path: backend-e2e.log

      - name: Upload ChromeDriver log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromedriver-log
          path: chromedriver.log
