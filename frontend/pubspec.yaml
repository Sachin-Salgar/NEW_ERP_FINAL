name: new_erp_final_frontend
description: "Frontend scaffold for NEW_ERP_FINAL — CORE-01 foundation"
publish_to: none
version: 0.1.0
environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^0.13.0
  flutter_secure_storage: ^8.0.0
  provider: ^6.0.0
  get_it: ^7.2.0
  google_fonts: ^8.2.0
  flutter_svg: ^2.3.0
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mockito: ^5.0.0
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
