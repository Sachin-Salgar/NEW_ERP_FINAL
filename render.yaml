services:
  - type: web
    name: NEW_ERP_FINAL
    runtime: docker
    repo: https://github.com/Sachin-Salgar/NEW_ERP_FINAL.git
    branch: main
    region: singapore
    # Free Render has no native pre-deploy command. Render must wait for the
    # GitHub production-provision check, which runs the canonical provisioner
    # before Render is allowed to deploy this commit.
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerCommand: sh /app/scripts/render-start.sh
    healthCheckPath: /api/v1/health/live
    # The web process is runtime-only. Never place DB_PROVISIONING_DATABASE_URL
    # or DB_MIGRATION_DATABASE_URL in Render runtime environment variables.
    envVars: []
