services:
  - type: web
    name: NEW_ERP_FINAL
    runtime: docker
    repo: https://github.com/Sachin-Salgar/NEW_ERP_FINAL.git
    branch: main
    region: singapore
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerCommand: sh /app/scripts/render-start.sh
    healthCheckPath: /api/v1/health/live
    # Deployment gate:
    # migrations -> platform-admin seed/verification -> application start.
    # The current Render service uses the free plan, so Render's native
    # preDeployCommand is unavailable. Keep the gate in render-start.sh.
    # The web service must only receive the normal application DATABASE_URL;
    # privileged platform-security credentials are rejected at startup.
    envVars: []
