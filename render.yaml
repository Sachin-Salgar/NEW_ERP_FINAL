services:
  - type: web
    name: NEW_ERP_FINAL
    runtime: docker
    repo: https://github.com/Sachin-Salgar/NEW_ERP_FINAL.git
    branch: main
    region: singapore
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerCommand: sh /app/scripts/render-start.sh
    healthCheckPath: /api/v1/health/live
    # Database provisioning and migrations are intentionally NOT part of
    # application startup. Privileged database credentials must never be
    # exposed to the running web service.
    # Provision the database once with the documented operator workflow,
    # then provide only DATABASE_URL (erp_app) and PLATFORM_DATABASE_URL
    # (erp_platform_executor) to this service.
    envVars: []
