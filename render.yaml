services:
  - type: web
    name: NEW_ERP_FINAL
    runtime: docker
    repo: https://github.com/Sachin-Salgar/NEW_ERP_FINAL.git
    branch: main
    region: singapore
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerCommand: sh /app/scripts/render-start.sh
    healthCheckPath: /api/v1/health/live
    # Database migrations are NOT part of web startup.
    # Paid Render web services should use preDeployCommand for migrations.
    # This Free service requires the documented operator migration workflow
    # before deploying application code that depends on a new schema.
    # Never provide PLATFORM_SECURITY_DATABASE_URL to the web service.
    envVars: []
